<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 880" font-family="Arial, sans-serif">
<title>Semaphore proposed systems and knowledge boundary</title>
<desc>The server owns state. Role-filtered observations reach the human and model. Both propose actions. Validation and the engine update state, then role-filtered feedback reaches both. The model never receives the human queue, unrevealed commits or future schedule.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#275e88"/></marker></defs>
<rect width="1440" height="880" fill="#f7f6f0"/>
<text x="55" y="60" font-size="36" fill="#172330" font-weight="700">Semaphore: proposed systems</text>
<text x="55" y="100" font-size="22" fill="#53616c" font-weight="400">Concept specification. No implementation or measured runtime behaviour yet.</text>
<rect x="55" y="175" width="350" height="220" fill="#e8eff3" stroke="#275e88" stroke-width="2"/>
<text x="75" y="211" font-size="24" fill="#275e88" font-weight="700">WORLD STATE / SERVER</text>
<text x="75" y="253" font-size="22" fill="#172330" font-weight="400">Both queues and deadlines</text>
<text x="75" y="286" font-size="22" fill="#172330" font-weight="400">Hidden schedule and seed</text>
<text x="75" y="319" font-size="22" fill="#172330" font-weight="400">Crossing, beat and score</text>
<text x="75" y="352" font-size="22" fill="#172330" font-weight="400">Authoritative session</text>
<rect x="520" y="175" width="340" height="200" fill="#fff" stroke="#d2d9d8" stroke-width="2"/>
<text x="540" y="211" font-size="24" fill="#172330" font-weight="700">PLAYER VIEW + INPUT</text>
<text x="540" y="253" font-size="22" fill="#172330" font-weight="400">Own side + public outcomes</text>
<text x="540" y="286" font-size="22" fill="#172330" font-weight="400">Signal, then private commit</text>
<text x="540" y="319" font-size="22" fill="#172330" font-weight="400">Departure + receiving switch</text>
<rect x="1010" y="190" width="365" height="200" fill="#fff" stroke="#d2d9d8" stroke-width="2"/>
<text x="1030" y="226" font-size="24" fill="#172330" font-weight="700">AGENT CONTEXT + ACTIONS</text>
<text x="1030" y="268" font-size="22" fill="#172330" font-weight="400">viewFor(side, phase)</text>
<text x="1030" y="301" font-size="22" fill="#172330" font-weight="400">Own queue + public crossing</text>
<text x="1030" y="334" font-size="22" fill="#172330" font-weight="400">Revealed signals + 8 rounds</text>
<text x="1030" y="367" font-size="22" fill="#172330" font-weight="400">Signal, then private commit</text>
<rect x="990" y="150" width="405" height="300" fill="none" stroke="#a54132" stroke-width="3" stroke-dasharray="10 7"/>
<text x="1010" y="430" font-size="20" fill="#a54132" font-weight="700">MODEL KNOWLEDGE BOUNDARY</text>
<rect x="520" y="540" width="340" height="185" fill="#fff0d0" stroke="#916016" stroke-width="2"/>
<text x="540" y="576" font-size="24" fill="#916016" font-weight="700">VALIDATION + TRANSITION</text>
<text x="540" y="618" font-size="22" fill="#172330" font-weight="400">Schema, ownership and phase</text>
<text x="540" y="651" font-size="22" fill="#172330" font-weight="400">Interlock, timeout and caps</text>
<text x="540" y="684" font-size="22" fill="#172330" font-weight="400">Engine applies valid actions</text>
<rect x="1010" y="540" width="365" height="185" fill="#fff" stroke="#d2d9d8" stroke-width="2"/>
<text x="1030" y="576" font-size="24" fill="#172330" font-weight="700">ROLE-FILTERED FEEDBACK</text>
<text x="1030" y="618" font-size="22" fill="#172330" font-weight="400">Trains, score and signals</text>
<text x="1030" y="651" font-size="22" fill="#172330" font-weight="400">Resolved public actions</text>
<text x="1030" y="684" font-size="22" fill="#172330" font-weight="400">Private traces → evaluation</text>
<path d="M405 230 H520" fill="none" stroke="#275e88" stroke-width="3" marker-end="url(#a)"/>
<text x="420" y="210" font-size="18" fill="#275e88" font-weight="400">view</text>
<path d="M230 395 V475 H1180 V450" fill="none" stroke="#275e88" stroke-width="3" marker-end="url(#a)"/>
<text x="430" y="465" font-size="20" fill="#275e88" font-weight="400">Filtered observation; current opposite signal only after reveal</text>
<path d="M690 375 V540" fill="none" stroke="#275e88" stroke-width="3" marker-end="url(#a)"/>
<text x="705" y="520" font-size="18" fill="#275e88" font-weight="400">human action</text>
<path d="M1190 450 V500 H880 V600 H860" fill="none" stroke="#275e88" stroke-width="3" marker-end="url(#a)"/>
<text x="1025" y="490" font-size="18" fill="#275e88" font-weight="400">agent action</text>
<path d="M520 640 H450 V770 H35 V285 H55" fill="none" stroke="#275e88" stroke-width="3" marker-end="url(#a)"/>
<text x="100" y="755" font-size="20" fill="#275e88" font-weight="400">Validated state update</text>
<path d="M860 650 H1010" fill="none" stroke="#275e88" stroke-width="3" marker-end="url(#a)"/>
<text x="875" y="628" font-size="18" fill="#275e88" font-weight="400">result</text>
<text x="70" y="820" font-size="23" fill="#a54132" font-weight="700">Never in agent context: human queue/deadlines, hidden commit, future arrivals, seed, source or evaluator tools.</text>
</svg>